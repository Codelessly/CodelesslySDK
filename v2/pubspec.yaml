name: codelessly_sdk_v2
description: Codelessly CloudUI™ - server-driven UI for Flutter. Renders Codelessly layouts natively, straight into Flutter render objects.
version: 9.0.0-beta.1
homepage: https://codelessly.com/
repository: https://github.com/Codelessly/CodelesslySDK

environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  barcode: ^2.2.9
  codelessly_api_v2: ^7.0.0-beta.1
  collection: ^1.19.1
  flutter_svg: ^2.0.17
  http: ^1.1.2
  intl: ^0.20.3
  just_audio: ^0.10.5
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  web: ^1.1.0

  # Store purchases: package:codelessly_sdk/store.dart.
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.5
  in_app_purchase_storekit: ^0.4.15

  # Firebase services: package:codelessly_sdk/firebase.dart. The rest of the
  # SDK never imports them, so an app can run without Firebase.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.0.6
  firebase_storage: ^13.0.6
  path_parsing: ^1.1.0
  video_player: ^2.14.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  # The script engine, for the scripting tests on the Dart VM
  # (tool/build_quickjs.sh builds its C sources for this machine). Apps add
  # it themselves; the SDK doesn't depend on it.
  codelessly_quickjs: ^0.1.0
