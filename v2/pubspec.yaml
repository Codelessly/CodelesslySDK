name: codelessly_sdk
description: Codelessly CloudUI™ - server-driven UI for Flutter. Renders Codelessly layouts natively, straight into Flutter render objects.
version: 9.0.0-beta.1
homepage: https://codelessly.com/
repository: https://github.com/Codelessly/CodelesslySDK

environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  barcode: ^2.2.9
  codelessly_api: ^7.0.0-beta.1
  collection: ^1.19.1
  flutter_svg: ^2.0.17
  http: ^1.1.2
  intl: ^0.20.3
  just_audio: ^0.10.5
  path_parsing: ^1.1.0
  video_player: ^2.14.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
