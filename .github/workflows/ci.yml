name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed --output=none lib test tool
      - run: flutter analyze
      - run: flutter test
      - name: Build the example for the web (WebAssembly)
        working-directory: example
        run: flutter build web --wasm
