name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: codelessly_sdk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: CodelesslySDK
      # The SDK develops against the model in a sibling checkout (a
      # pubspec_overrides.yaml, gitignored, written below), so a change that
      # spans both repositories is tested before the model is published.
      - uses: actions/checkout@v7
        with:
          repository: Codelessly/CodelesslyAPI
          # Paired model revision for these runtime actions and widget fields.
          ref: 93282db4d87560d843bc7d8cb21951ac4009a69d
          path: CodelesslyAPI
      - name: Use the sibling CodelesslyAPI checkout
        run: |
          printf 'dependency_overrides:\n  codelessly_api:\n    path: ../CodelesslyAPI\n' > CodelesslySDK/pubspec_overrides.yaml
          printf 'dependency_overrides:\n  codelessly_api:\n    path: ../../CodelesslyAPI\n' > CodelesslySDK/example/pubspec_overrides.yaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: CodelesslySDK
        run: flutter pub get
      - name: Analyze
        working-directory: CodelesslySDK
        run: flutter analyze
      # The scripting tests build QuickJS for the machine
      # (tool/build_quickjs.sh: CMake and a C compiler, both on the runner).
      - name: Test
        working-directory: CodelesslySDK
        run: flutter test
      # The example holds the README's and the guide's code samples
      # (lib/snippets.dart) and the guide's tests (test/guide_test.dart).
      - name: Analyze the example
        working-directory: CodelesslySDK/example
        run: flutter analyze
      - name: Test the example
        working-directory: CodelesslySDK/example
        run: flutter test
      # The streaming chat example resolves codelessly_api from the sibling
      # checkout (tool/use_local_api.sh writes its pubspec_overrides.yaml),
      # then analyzes with no issue and runs its offline tests.
      - name: Check the stream_chat example
        working-directory: CodelesslySDK/examples/stream_chat
        run: tool/check.sh ../../../CodelesslyAPI
