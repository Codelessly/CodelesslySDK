name: codelessly_quickjs
description: The sandboxed JavaScript engine (QuickJS) that runs Codelessly scripts on Android, iOS, macOS and Linux. Add it to apps whose Codelessly projects use scripts.
version: 0.1.0
homepage: https://codelessly.com/
repository: https://github.com/Codelessly/CodelesslySDK/tree/master/codelessly_quickjs

environment:
  sdk: ^3.9.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
