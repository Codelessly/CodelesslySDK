name: codelessly_sdk
description: Codelessly CloudUI™ - Server-driven UI for Flutter. Supercharge your Flutter apps with dynamic UI and real-time updates. Build and publish UI without code!
version: 6.2.0
homepage: https://codelessly.com/
repository: https://github.com/Codelessly/CodelesslySDK

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  # Codelessly
  codelessly_api: ^5.0.0
  json_annotation: ^4.12.0

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_ui_firestore: ^2.1.0
  google_fonts: ^9.0.0

  # Core Flutter
  collection: '>=1.17.0 <2.0.0'
  http: '>=1.1.2 <2.0.0'
  intl: '>=0.17.0 <1.0.0'
  logging: ^1.3.0
  meta: ">=1.9.0 <2.0.0"
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.17.0
  webview_flutter_web: ^0.2.3+4
  web: ^1.1.0

  # 3rd Party Core Framework
  equatable: ^3.0.0
  vector_math: ^2.1.4
  provider: ^6.1.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.0.17

  # File and Image
  path: ^1.9.0
  path_provider: ^2.1.5

  # Storage and Caching
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.2.0

  # JSON
  json_path: ^0.9.0
  rfc_6901: ^0.2.0 # JSON pointer spec
  jwt_decoder: ^2.0.1

  # Project UI
  flutter_animation_progress_bar: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  build_runner: ^2.4.14
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/codelessly_logo.png

false_secrets:
  - /lib/src/constants.dart
  - /lib/src/firebase_options_prod.dart

scripts: scripts.yaml

# codelessly_api 5.0.0 is not on pub.dev yet. Remove once it is published.
dependency_overrides:
  codelessly_api:
    git:
      url: https://github.com/Codelessly/CodelesslyAPI.git
      ref: claude/hopeful-brown-c8o8x7
