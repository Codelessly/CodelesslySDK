name: example
description: A flutter project demonstrating how to use the CodelesslySDK.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  storybook_flutter: ^0.14.1
  codelessly_sdk:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# codelessly_api 5.0.0 is not on pub.dev yet. Remove once it is published.
dependency_overrides:
  codelessly_api:
    git:
      url: https://github.com/Codelessly/CodelesslyAPI.git
      ref: claude/hopeful-brown-c8o8x7
