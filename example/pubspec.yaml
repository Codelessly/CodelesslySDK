name: example
description: A flutter project demonstrating how to use the CodelesslySDK.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  codelessly_sdk:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Temporary: the show toast action needs codelessly_api from
# Codelessly/CodelesslyAPI#37. Remove once that is published.
dependency_overrides:
  codelessly_api:
    git:
      url: https://github.com/Codelessly/CodelesslyAPI.git
      ref: claude/project-thread-1mdfl3
