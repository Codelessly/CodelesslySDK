name: skip_shell
description: The generated Skip screens running as an app. One data store, navigation by the screens' own events, a person switch.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  codelessly_sdk:
    path: ../../..
  codelessly_api: ^30.1.0
  # The frame around the phone is the Editor's design system (design 15 §4.1).
  soft_saas_ui:
    path: ../../../../OverlookV2/packages/soft_saas_ui

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/screens/
    - assets/themes/
