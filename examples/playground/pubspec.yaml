name: playground
description: Type the compact notation, see it render. A design system switch, the issues the parser reports, and the document it expands to.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  codelessly_sdk:
    path: ../..
  codelessly_api: ^31.0.0
  # The Editor's design system: this page is built to move into CodelesslyEditor as it is.
  soft_saas_ui:
    path: ../../../OverlookV2/packages/soft_saas_ui

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/design_systems/
    - assets/samples/
